plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jarvis.ai'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jarvis.ai'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField "String", "GEMINI_KEY", "\"${System.getenv('GEMINI_KEY') ?: ''}\""
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

